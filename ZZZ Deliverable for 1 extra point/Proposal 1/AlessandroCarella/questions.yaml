  answer_text: "\nIf you need to merge two ordered lists with complicated sorting
    rules, you might have to roll it yourself like in the following code (using a
    simple sorting rule for readability :-) ).\n\nlist1 = [1,2,5]\nlist2 = [2,3,4]\nnewlist
    = []\n\nwhile list1 and list2:\n    if list1[0] == list2[0]:\n        newlist.append(list1.pop(0))\n
    \       list2.pop(0)\n    elif list1[0] < list2[0]:\n        newlist.append(list1.pop(0))\n
    \   else:\n        newlist.append(list2.pop(0))\n\nif list1:\n    newlist.extend(list1)\nif
    list2:\n    newlist.extend(list2)\n\nassert(newlist == [1, 2, 3, 4, 5])\n\n    "
  answer_code: |
    list1 = [1,2,5]
    list2 = [2,3,4]
    newlist = []

    while list1 and list2:
        if list1[0] == list2[0]:
            newlist.append(list1.pop(0))
            list2.pop(0)
        elif list1[0] < list2[0]:
            newlist.append(list1.pop(0))
        else:
            newlist.append(list2.pop(0))

    if list1:
        newlist.extend(list1)
    if list2:
        newlist.extend(list2)

    assert(newlist == [1, 2, 3, 4, 5])
