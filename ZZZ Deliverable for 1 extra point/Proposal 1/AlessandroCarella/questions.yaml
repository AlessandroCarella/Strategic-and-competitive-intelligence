  answer_text: "\nTo understand what yield does, you must understand what generators
    are. And before you can understand generators, you must understand iterables.\nIterables\nWhen
    you create a list, you can read its items one by one. Reading its items one by
    one is called iteration:\n>>> mylist = [1, 2, 3]\n>>> for i in mylist:\n...    print(i)\n1\n2\n3\n\nmylist
    is an iterable. When you use a list comprehension, you create a list, and so an
    iterable:\n>>> mylist = [x*x for x in range(3)]\n>>> for i in mylist:\n...    print(i)\n0\n1\n4\n\nEverything
    you can use \"for... in...\" on is an iterable; lists, strings, files...\nThese
    iterables are handy because you can read them as much as you wish, but you store
    all the values in memory and this is not always what you want when you have a
    lot of values.\nGenerators\nGenerators are iterators, a kind of iterable you can
    only iterate over once. Generators do not store all the values in memory, they
    generate the values on the fly:\n>>> mygenerator = (x*x for x in range(3))\n>>>
    for i in mygenerator:\n...    print(i)\n0\n1\n4\n\nIt is just the same except
    you used () instead of []. BUT, you cannot perform for i in mygenerator a second
    time since generators can only be used once: they calculate 0, then forget about
    it and calculate 1, and end after calculating 4, one by one.\nYield\nyield is
    a keyword that is used like return, except the function will return a generator.\n>>>
    def create_generator():\n...    mylist = range(3)\n...    for i in mylist:\n...
    \       yield i*i\n...\n>>> mygenerator = create_generator() # create a generator\n>>>
    print(mygenerator) # mygenerator is an object!\n<generator object create_generator
    at 0xb7555c34>\n>>> for i in mygenerator:\n...     print(i)\n0\n1\n4\n\nHere it's
    a useless example, but it's handy when you know your function will return a huge
    set of values that you will only need to read once.\nTo master yield, you must
    understand that when you call the function, the code you have written in the function
    body does not run. The function only returns the generator object, this is a bit
    tricky.\nThen, your code will continue from where it left off each time for uses
    the generator.\nNow the hard part:\nThe first time the for calls the generator
    object created from your function, it will run the code in your function from
    the beginning until it hits yield, then it'll return the first value of the loop.
    Then, each subsequent call will run another iteration of the loop you have written
    in the function and return the next value. This will continue until the generator
    is considered empty, which happens when the function runs without hitting yield.
    That can be because the loop has come to an end, or because you no longer satisfy
    an \"if/else\".\nYour code explained\nGenerator:\n# Here you create the method
    of the node object that will return the generator\ndef _get_child_candidates(self,
    distance, min_dist, max_dist):\n\n    # Here is the code that will be called each
    time you use the generator object:\n\n    # If there is still a child of the node
    object on its left\n    # AND if the distance is ok, return the next child\n    if
    self._leftchild and distance - max_dist < self._median:\n        yield self._leftchild\n\n
    \   # If there is still a child of the node object on its right\n    # AND if
    the distance is ok, return the next child\n    if self._rightchild and distance
    + max_dist >= self._median:\n        yield self._rightchild\n\n    # If the function
    arrives here, the generator will be considered empty\n    # There are no more
    than two values: the left and the right children\n\nCaller:\n# Create an empty
    list and a list with the current object reference\nresult, candidates = list(),
    [self]\n\n# Loop on candidates (they contain only one element at the beginning)\nwhile
    candidates:\n\n    # Get the last candidate and remove it from the list\n    node
    = candidates.pop()\n\n    # Get the distance between obj and the candidate\n    distance
    = node._get_dist(obj)\n\n    # If the distance is ok, then you can fill in the
    result\n    if distance <= max_dist and distance >= min_dist:\n        result.extend(node._values)\n\n
    \   # Add the children of the candidate to the candidate's list\n    # so the
    loop will keep running until it has looked\n    # at all the children of the children
    of the children, etc. of the candidate\n    candidates.extend(node._get_child_candidates(distance,
    min_dist, max_dist))\n\nreturn result\n\nThis code contains several smart parts:\nThe
    loop iterates on a list, but the list expands while the loop is being iterated.
    It's a concise way to go through all these nested data even if it's a bit dangerous
    since you can end up with an infinite loop. In this case, candidates.extend(node._get_child_candidates(distance,
    min_dist, max_dist)) exhausts all the values of the generator, but while keeps
    creating new generator objects which will produce different values from the previous
    ones since it's not applied on the same node.\n\nThe extend() method is a list
    object method that expects an iterable and adds its values to the list.\n\nUsually,
    we pass a list to it:\n>>> a = [1, 2]\n>>> b = [3, 4]\n>>> a.extend(b)\n>>> print(a)\n[1,
    2, 3, 4]\n\nBut in your code, it gets a generator, which is good because:\nYou
    don't need to read the values twice.\nYou may have a lot of children and you don't
    want them all stored in memory.\nAnd it works because Python does not care if
    the argument of a method is a list or not. Python expects iterables so it will
    work with strings, lists, tuples, and generators! This is called duck typing and
    is one of the reasons why Python is so cool. But this is another story, for another
    question...\nYou can stop here, or read a little bit to see an advanced use of
    a generator:\nControlling a generator exhaustion\n>>> class Bank(): # Let's create
    a bank, building ATMs\n...    crisis = False\n...    def create_atm(self):\n...
    \       while not self.crisis:\n...            yield \"$100\"\n>>> hsbc = Bank()
    # When everything's ok the ATM gives you as much as you want\n>>> corner_street_atm
    = hsbc.create_atm()\n>>> print(corner_street_atm.next())\n$100\n>>> print(corner_street_atm.next())\n$100\n>>>
    print([corner_street_atm.next() for cash in range(5)])\n['$100', '$100', '$100',
    '$100', '$100']\n>>> hsbc.crisis = True # Crisis is coming, no more money!\n>>>
    print(corner_street_atm.next())\n<type 'exceptions.StopIteration'>\n>>> wall_street_atm
    = hsbc.create_atm() # It's even true for new ATMs\n>>> print(wall_street_atm.next())\n<type
    'exceptions.StopIteration'>\n>>> hsbc.crisis = False # The trouble is, even post-crisis
    the ATM remains empty\n>>> print(corner_street_atm.next())\n<type 'exceptions.StopIteration'>\n>>>
    brand_new_atm = hsbc.create_atm() # Build a new one to get back in business\n>>>
    for cash in brand_new_atm:\n...    print cash\n$100\n$100\n$100\n$100\n$100\n$100\n$100\n$100\n$100\n...\n\nNote:
    For Python 3, useprint(corner_street_atm.__next__()) or print(next(corner_street_atm))\nIt
    can be useful for various things like controlling access to a resource.\nItertools,
    your best friend\nThe itertools module contains special functions to manipulate
    iterables. Ever wish to duplicate a generator?\nChain two generators? Group values
    in a nested list with a one-liner? Map / Zip without creating another list?\nThen
    just import itertools.\nAn example? Let's see the possible orders of arrival for
    a four-horse race:\n>>> horses = [1, 2, 3, 4]\n>>> races = itertools.permutations(horses)\n>>>
    print(races)\n<itertools.permutations object at 0xb754f1dc>\n>>> print(list(itertools.permutations(horses)))\n[(1,
    2, 3, 4),\n (1, 2, 4, 3),\n (1, 3, 2, 4),\n (1, 3, 4, 2),\n (1, 4, 2, 3),\n (1,
    4, 3, 2),\n (2, 1, 3, 4),\n (2, 1, 4, 3),\n (2, 3, 1, 4),\n (2, 3, 4, 1),\n (2,
    4, 1, 3),\n (2, 4, 3, 1),\n (3, 1, 2, 4),\n (3, 1, 4, 2),\n (3, 2, 1, 4),\n (3,
    2, 4, 1),\n (3, 4, 1, 2),\n (3, 4, 2, 1),\n (4, 1, 2, 3),\n (4, 1, 3, 2),\n (4,
    2, 1, 3),\n (4, 2, 3, 1),\n (4, 3, 1, 2),\n (4, 3, 2, 1)]\n\nUnderstanding the
    inner mechanisms of iteration\nIteration is a process implying iterables (implementing
    the __iter__() method) and iterators (implementing the __next__() method).\nIterables
    are any objects you can get an iterator from. Iterators are objects that let you
    iterate on iterables.\nThere is more about it in this article about how for loops
    work.\n    "
