    == null) {\n            bestMove = child.getState();\n            bestScore =
    alpha;\n        }\n    }\n    return bestMove;\n}\n\n\n\n\nFinally (even more
    fun), just a suggestion, a method name change to clarify the intent of  terminalNode(),
    though I would move this into GameState so it could be called with no parameters:\n\n\n\nprivate
    boolean isTerminal(GameState state) {\n    //return Is.any(state.getStatus(),
