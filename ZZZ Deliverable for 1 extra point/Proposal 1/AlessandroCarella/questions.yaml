question_title: Generate list of possible moves Python Tic-Tac-Toe
question_votes: -1.0
question_text: "I am currently working on a project for one of my classes where I
  have to implement an AI opponent to play tic-tac-toe using minmax and Alpha-Beta
  minmax algorithms to determine the moves. \nThe problem I am having however is attempting
  to generate a list of possible moves for a board.\nMy problem code is as follows\nMy
  board is represented as a list of 9 strings initialized to [\"*\", \"*\", \"*\",
  \"*\", \"*\", \"*\", \"*\", \"*\", \"*\"].\nMy goal is to have move list return
  a list of tuples with the first element of the tuple being i (Where the X or O was
  inserted) and the second element being the resulting board.\nThe problem I have
  is that I will recieve a list with the correct number of possible moves (Eg: If
  I manually play the first 4 moves for both sides it will only give me 5 possible
  moves) however it will place the same move in each location that contains a *. (So
  it ends up generating something like X,O,O,O,O,O,O,O,O for possible second moves)\nThis
  is not the first time I have had to use minmax but it is the first time I've had
  to do it in python.\nAny suggestions for how to get around this issue would be helpful!\nThanks!"
question_code: |
  def genMoves(genBoard, turnNumber):
      moveList = []

      print "inMovesList"
      #Figure out if X or O go now

      if turnNumber % 2 == 0:
          moveChar = "O"
      else:
          moveChar = "X"

      i = 0;

      while i < 9:
          tempBoard = genBoard
          if tempBoard[i] == "*":
              #set tempBoard[i] to X or O
              tempBoard[i] = moveChar
              #append move, new board
              moveList.append((i, tempBoard))

          i+=1

      print "MovesList: "
      print moveList
      return moveList
answers_number: 2.0
answers:
- answer_id: '15577169'
  answer_text: "\nThis line is a problem:\n\ntempBoard = genBoard\n\n\nAfter this
    line, you seem to think that you have two lists -- the original, still referenced\nby
    genBoard, and a new one, now referenced by tempBoard. This is not the case.\n\nThis
    line does not create a copy of the list. Instead, it binds the name tempBoard
    to refer to the same object that genBoard is bound to.\n\nConsequently, subsequent
    references to tempBoard[i] also affect genBoard[i].\n\nTry one of these instead:\n\ntempBoard
    = list(genBoard)\ntempBoard = genBoard[:]\ntempBoard = copy.copy(genBoard)\n\n\nEach
    of these lines creates a new list, the initial contents of which is the same as
    genBoard. tempboard is bound to this new list, while genboard remains bound to
    the old list.\n\nIf the object in question were more complicated than a list of
    strings, you might need to do this:\n\ntempBoard = copy.deepcopy(genBoard)\n\n
    \   "
  answer_code:
  - |
    tempBoard = genBoard
  - |
    tempBoard = list(genBoard)
    tempBoard = genBoard[:]
    tempBoard = copy.copy(genBoard)
  - |
    tempBoard = copy.deepcopy(genBoard)
  answer_votes: 1
