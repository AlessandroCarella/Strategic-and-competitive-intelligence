  answer_comments: []
- answer_id: '40022748'
  answer_text: "\nIn summary, the yield statement transforms your function into a
    factory that produces a special object called a generator which wraps around the
    body of your original function. When the generator is iterated, it executes your
    function  until it reaches the next yield then suspends execution and evaluates
    to the value passed to yield. It repeats this process on each iteration until
    the path of execution exits the function. For instance,\n\ndef simple_generator():\n
    \   yield 'one'\n    yield 'two'\n    yield 'three'\n\nfor i in simple_generator():\n
    \   print i\n\n\nsimply outputs\n\none\ntwo\nthree\n\n\nThe power comes from using
    the generator with a loop that calculates a sequence, the generator executes the
    loop stopping each time to 'yield' the next result of the calculation, in this
    way it calculates a list on the fly, the benefit being the memory saved for especially
    large calculations\n\nSay you wanted to create a your own range function that
    produces an iterable range of numbers, you could do it like so,\n\ndef myRangeNaive(i):\n
    \   n = 0\n    range = []\n    while n < i:\n        range.append(n)\n        n
    = n + 1\n    return range\n\n\nand use it like this;\n\nfor i in myRangeNaive(10):\n
    \   print i\n\n\nBut this is inefficient because\n\nYou create an array that you
    only use once (this wastes memory)\nThis code actually loops over that array twice!
    :(\nLuckily Guido and his team were generous enough to develop generators so we
    could just do this;\n\ndef myRangeSmart(i):\n    n = 0\n    while n < i:\n       yield
    n\n       n = n + 1\n    return\n\nfor i in myRangeSmart(10):\n    print i\n\n\nNow
    upon each iteration a function on the generator called next() executes the function
    until it either reaches a 'yield' statement in which it stops and  'yields' the
    value or reaches the end of the function. In this case on the first call, next()
    executes up to the yield statement and yield 'n', on the next call it will execute
    the  increment statement, jump back to the 'while', evaluate it, and if true,
    it will stop and yield 'n' again, it will continue that way until the while condition
    returns false and the generator jumps to the end of the function.\n    "
  answer_code:
  - |
    def simple_generator():
        yield 'one'
        yield 'two'
        yield 'three'

    for i in simple_generator():
        print i
  - |
    one
    two
    three
  - |
    def myRangeNaive(i):
        n = 0
        range = []
        while n < i:
            range.append(n)
            n = n + 1
        return range
  - |
    for i in myRangeNaive(10):
        print i
  - |
    def myRangeSmart(i):
        n = 0
        while n < i:
           yield n
           n = n + 1
        return

    for i in myRangeSmart(10):
        print i
