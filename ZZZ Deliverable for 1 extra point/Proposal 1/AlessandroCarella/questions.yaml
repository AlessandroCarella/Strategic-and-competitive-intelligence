question_title: Analog output from USB6009 using python and NIDAQmx base on Mac OSX
question_votes: 1.0
question_text: "All, \nI'm attempting to use Python and DAQmx Base to record analog
  input and generate analog output from my USB 6009 device. I've been using a wrapper
  I found and have been able to get AI but am struggling with AO.\nThere is a base
  class NITask which handles task generation etc. The class i'm calling is below.
  The function throws an error when I try to configure the clock. When I do not there
  is no error but nor is there voltage generated on the output. Any help would be
  appreciated. \nThanks!"
question_code: |
  class AOTask(NITask):
      def __init__(self, min=0.0, max=5.0,
                   channels=["Dev1/ao0"],
                   timeout=10.0):
