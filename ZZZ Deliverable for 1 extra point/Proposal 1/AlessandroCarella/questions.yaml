  answer_text: "\nI recommend three methods to concatenate the list, but the first
    method is most recommended,\n# Easiest and least complexity method <= recommended\n\nlistone
    = [1, 2, 3]\nlisttwo = [4, 5, 6]\n\nnewlist = listone + listtwo\nprint(newlist)\n\n#
    Second-easiest method\nnewlist = listone.copy()\nnewlist.extend(listtwo)\nprint(newlist)\n\nIn
    the second method, I assign newlist to a copy of the listone, because I don't
    want to change listone.\n# Third method\nnewlist = listone.copy()\nfor j in listtwo:\n
    \   newlist.append(j)\n\nprint(newlist)\n\nThis is not a good way to concatenate
    lists because we are using a for loop to concatenate the lists. So time complexity
    is much higher than with the other two methods.\n    "
  answer_code:
  - |
    # Easiest and least complexity method <= recommended

    listone = [1, 2, 3]
    listtwo = [4, 5, 6]

    newlist = listone + listtwo
    print(newlist)

    # Second-easiest method
    newlist = listone.copy()
    newlist.extend(listtwo)
    print(newlist)
  - |
    # Third method
    newlist = listone.copy()
    for j in listtwo:
        newlist.append(j)

    print(newlist)
