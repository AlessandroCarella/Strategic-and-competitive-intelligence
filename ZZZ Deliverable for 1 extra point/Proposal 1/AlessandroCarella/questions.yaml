        #  data = numpy.float64(3.25)
          data = data.astype(numpy.float64)
          self.CHK(self.nidaq.DAQmxBaseWriteAnalogF64(self.taskHandle,
              int32(1000), 0,float64(-1),DAQmx_Val_GroupByChannel,
