  answer_text: "\nYour logic for finding and highlighting words has gotten a little
    convoluted. To some degree that's inevitable, but you'll find you have a much
    easier time if you break it down into bite-sized chunks. I recommend starting
    fresh on that part.\nYou know you need to highlight specific letters within your
    matrix. Make a function to do that, agnostic of specific words. The arguments
    will be the matrix and a list of coordinate pairs specifying which letters should
    be highlighted. The return value is a copy of the matrix with the necessary highlighting.\ndef
    highlight_chars(matrix, indices):\n    result = matrix.copy()\n    for i, j in
    indices:\n        result[i][j] = Fore.RED + matrix[i][j] + Style.RESET_ALL\n    return
    result\n\nOnce you have that, you can start writing functions that find words
    and spit out coordinates for the letters in those words. I would write a separate
    function for each search direction. Here's a couple to get you started:\ndef find_horizontal(matrix,
    words):\n    indices = []\n    for i, row in enumerate(matrix):\n        row_str
    = ''.join(row)\n        for word in words:\n            start_index = row_str.find(word)\n
    \           if start_index >= 0:\n                for k in range(len(word)):\n
    \                   indices.append((i, start_index + k))\n    return indices\n\ndef
    find_vertical(matrix, words):\n    indices = []\n    for j in range(len(matrix[0])):\n
    \       column_str = ''.join(row[j] for row in matrix)\n        for word in words:\n
    \           start_index = column_str.find(word)\n            if start_index >=
    0:\n                for k in range(len(word)):\n                    indices.append((start_index
    + k, j))\n    return indices\n\nIf you want to add features like diagonals and
    searching backwards, you should be able to implement functions for those without
    too much trouble using similar methods.\nFinally, tie it all together with your
    search_words() function:\ndef search_words(matrix, words):\n    indices = find_horizontal(matrix,
    words)\n    indices += find_vertical(matrix, words)\n    \n    found = highlight_chars(matrix,
    indices)\n    return found\n\nNote that this will return a matrix, so you'll want
    to print it the same way you print it row-by-row the same way you printed the
    first one.\nUnfortunately, if you use a large word dictionary (like this one with
    over 370,000 words) you may end up with more highlighted than not, making the
    output difficult to parse.\n    "
  answer_code:
