- answer_id: '231778'
  answer_text: "\nyield is just like return - it returns whatever you tell it to (as
    a generator). The difference is that the next time you call the generator, execution
    starts from the last call to the yield statement. Unlike return, the stack frame
    is not cleaned up when a yield occurs, however control is transferred back to
    the caller, so its state will resume the next time the function is called.\n\nIn
    the case of your code, the function get_child_candidates is acting like an iterator
    so that when you extend your list, it adds one element at a time to the new list.\n\nlist.extend
    calls an iterator until it's exhausted. In the case of the code sample you posted,
    it would be much clearer to just return a tuple and append that to the list.\n
    \   "
