    is a node's score: the final value of beta in a min node is considered for the
    alpha value of its parent max node; likewise, the final value of alpha in a max
    node is considered for the beta value of its parent min node. Therefore:\n\nThe
    answer to your question is the algorithm itself, as it's the most relevant trick.\n\nThat
