  answer_text: "\nAll great answers, however a bit difficult for newbies.\n\nI assume
    you have learned the return statement.\n\nAs an analogy, return and yield are
    twins. return means 'return and stop' whereas 'yield` means 'return, but continue'\n\n\n
    \ Try to get a num_list with return.\n  \n\ndef num_list(n):\n    for i in range(n):\n
    \       return i\n\n\nRun it:\n\nIn [5]: num_list(3)\nOut[5]: 0\n\n\nSee, you
    get only a single number rather than a list of them. return never allows you prevail
    happily, just implements once and quit.\n\n\n  There comes yield\n  \n\nReplace
    return with yield:\n\nIn [10]: def num_list(n):\n    ...:     for i in range(n):\n
    \   ...:         yield i\n    ...:\n\nIn [11]: num_list(3)\nOut[11]: <generator
    object num_list at 0x10327c990>\n\nIn [12]: list(num_list(3))\nOut[12]: [0, 1,
    2]\n\n\nNow, you win to get all the numbers.\n\nComparing to return which runs
    once and stops, yield runs times you planed.\nYou can interpret return as return
    one of them, and yield as return all of them. This is called iterable.\n\n\n  One
    more step we can rewrite yield statement with return\n  \n\nIn [15]: def num_list(n):\n
    \   ...:     result = []\n    ...:     for i in range(n):\n    ...:         result.append(i)\n
    \   ...:     return result\n\nIn [16]: num_list(3)\nOut[16]: [0, 1, 2]\n\n\nIt's
    the core about yield.\n\nThe difference between a list return outputs and the
    object yield output is:\n\nYou will always get [0, 1, 2] from a list object but
    only could retrieve them from 'the object yield output' once. So, it has a new
    name generator object as displayed in Out[11]: <generator object num_list at 0x10327c990>.\n\nIn
    conclusion, as a metaphor to grok it:\n\nreturn and yield are twins\nlist and
    generator are twins\n"
