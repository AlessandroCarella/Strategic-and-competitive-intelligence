      GCC specific extensions that allow looping?'
    comment_user: qwr
  - comment_text: 'Right, you are right. What I was thinking about is that you can''t
      do that "inline" inside a macro #define MACRO  { #if stuff #deifne this #else
      #define this #endif }. So some expressions are not possible - basically macro
      expansion has to expand to single syntactic form. If that would be possible
      - macros could define other macros, conditionally - then one way or the other
      people would find a way to write loops.'
    comment_user: KamilCuk
  - comment_text: '@qwr: No, no looping extensions that I''ve ever heard of.  People
      have accomplished loop-like behavior with recursive includes, e.g. ioccc.org/1995/vanschnitz.c,
      but this is best left to the IOCCC.'
    comment_user: Nate Eldredge
