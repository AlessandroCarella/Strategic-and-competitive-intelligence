  answer_text: "\nYou already fixed your problem, but the problem you encountered
    is pretty common. So whenever you build a part of the algorithm for an AI agent,
    you have to test it properly. So once your minimax algorithm is correct, you can
    just generate many random trees and check whether the results are the same. For
    example in python you can do this in this way:\n\nclass Node():\n    def __init__(self,
    data, children):\n        self.data = data\n        self.children = children\n\ndef
    generateTree(depth, branching):\n    total = branching**depth\n    values = [randint(-100,
    100) for _ in xrange(total)]\n    level = [Node(values[i], []) for i in xrange(total)]\n\n
    \   for _ in xrange(depth):\n        total /= branching\n        level = [Node(None,
    level[i * branching: (i+1) * branching]) for i in xrange(total)]\n\n    return
    level[0], values\n\n\nNow you can generate a tree with many random trees and compare
    the results.\n\ntree, values = generateTree(depth, branching)\nprint negamax(tree,
    depth, 1) == alpha_beta_negamax(tree, depth, float('-inf'), float('inf'), 1)\n\n\nDo
    not forget that minimax and alpha-beta return just the best value, whereas what
    you are interested in a real game is a move. It is straightforward to modify them
    in such a way that they can return a move, but this is up to a developer to decide
    how the move is returned. This is because there can be many moves that lead to
    the best solution (you can return the first one, last one or the most common one
    is to find all the moves and to return the random one).\n\nIn your case the problem
    was with the randomness of the returned values, so during the testing the good
    approach is to fix randomness.\n    "
  answer_code:
  - |
    class Node():
        def __init__(self, data, children):
            self.data = data
            self.children = children

    def generateTree(depth, branching):
        total = branching**depth
        values = [randint(-100, 100) for _ in xrange(total)]
        level = [Node(values[i], []) for i in xrange(total)]

        for _ in xrange(depth):
            total /= branching
            level = [Node(None, level[i * branching: (i+1) * branching]) for i in xrange(total)]

        return level[0], values
  - |
