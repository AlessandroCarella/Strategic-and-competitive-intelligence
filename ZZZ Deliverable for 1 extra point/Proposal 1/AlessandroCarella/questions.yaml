- answer_id: '31042491'
  answer_text: "\n\nWhat does the yield keyword do in Python?\n\nAnswer Outline/Summary\nA
    function with yield, when called, returns a Generator.\nGenerators are iterators
    because they implement the iterator protocol, so you can iterate over them.\nA
    generator can also be sent information, making it conceptually a coroutine.\nIn
    Python 3, you can delegate from one generator to another in both directions with
    yield from.\n(Appendix critiques a couple of answers, including the top one, and
    discusses the use of return in a generator.)\nGenerators:\nyield is only legal
    inside of a function definition, and the inclusion of yield in a function definition
    makes it return a generator.\nThe idea for generators comes from other languages
    (see footnote 1) with varying implementations. In Python's Generators, the execution
    of the code is frozen at the point of the yield. When the generator is called
    (methods are discussed below) execution resumes and then freezes at the next yield.\nyield
    provides an\neasy way of implementing the iterator protocol, defined by the following
    two methods:\n__iter__ and __next__.  Both of those methods\nmake an object an
    iterator that you could type-check with the Iterator Abstract Base\nClass from
    the collections module.\ndef func():\n    yield 'I am'\n    yield 'a generator!'\n\nLet's
    do some introspection:\n>>> type(func)                 # A function with yield
    is still a function\n<type 'function'>\n>>> gen = func()\n>>> type(gen)                  #
    but it returns a generator\n<type 'generator'>\n>>> hasattr(gen, '__iter__')   #
    that's an iterable\nTrue\n>>> hasattr(gen, '__next__')   # and with .__next__\nTrue
    \                          # implements the iterator protocol.\n\nThe generator
    type is a sub-type of iterator:\nfrom types import GeneratorType\nfrom collections.abc
    import Iterator\n\n>>> issubclass(GeneratorType, Iterator)\nTrue\n\nAnd if necessary,
    we can type-check like this:\n>>> isinstance(gen, GeneratorType)\nTrue\n>>> isinstance(gen,
    Iterator)\nTrue\n\nA feature of an Iterator is that once exhausted, you can't
    reuse or reset it:\n>>> list(gen)\n['I am', 'a generator!']\n>>> list(gen)\n[]\n\nYou'll
    have to make another if you want to use its functionality again (see footnote
    2):\n>>> list(func())\n['I am', 'a generator!']\n\nOne can yield data programmatically,
    for example:\ndef func(an_iterable):\n    for item in an_iterable:\n        yield
    item\n\nThe above simple generator is also equivalent to the below - as of Python
    3.3 you can use yield from:\ndef func(an_iterable):\n    yield from an_iterable\n\nHowever,
    yield from also allows for delegation to subgenerators,\nwhich will be explained
    in the following section on cooperative delegation with sub-coroutines.\nCoroutines:\nyield
    forms an expression that allows data to be sent into the generator (see footnote
    3)\nHere is an example, take note of the received variable, which will point to
    the data that is sent to the generator:\ndef bank_account(deposited, interest_rate):\n
    \   while True:\n        calculated_interest = interest_rate * deposited \n        received
    = yield calculated_interest\n        if received:\n            deposited += received\n\n\n>>>
    my_account = bank_account(1000, .05)\n\nFirst, we must queue up the generator
    with the built-in function, next. It will\ncall the appropriate next or __next__
    method, depending on the version of\nPython you are using:\n>>> first_year_interest
    = next(my_account)\n>>> first_year_interest\n50.0\n\nAnd now we can send data
    into the generator. (Sending None is\nthe same as calling next.) :\n>>> next_year_interest
    = my_account.send(first_year_interest + 1000)\n>>> next_year_interest\n102.5\n\nCooperative
    Delegation to Sub-Coroutine with yield from\nNow, recall that yield from is available
    in Python 3. This allows us to delegate coroutines to a subcoroutine:\n\ndef money_manager(expected_rate):\n
    \   # must receive deposited value from .send():\n    under_management = yield
    \                  # yield None to start.\n    while True:\n        try:\n            additional_investment
    = yield expected_rate * under_management \n            if additional_investment:\n
    \               under_management += additional_investment\n        except GeneratorExit:\n
    \           '''TODO: write function to send unclaimed funds to state'''\n            raise\n
    \       finally:\n            '''TODO: write function to mail tax info to client'''\n
    \       \n\ndef investment_account(deposited, manager):\n    '''very simple model
    of an investment account that delegates to a manager'''\n    # must queue up manager:\n
    \   next(manager)      # <- same as manager.send(None)\n    # This is where we
    send the initial deposit to the manager:\n    manager.send(deposited)\n    try:\n
    \       yield from manager\n    except GeneratorExit:\n        return manager.close()
    \ # delegate?\n\nAnd now we can delegate functionality to a sub-generator and
    it can be used\nby a generator just as above:\nmy_manager = money_manager(.06)\nmy_account
    = investment_account(1000, my_manager)\nfirst_year_return = next(my_account) #
    -> 60.0\n\nNow simulate adding another 1,000 to the account plus the return on
    the account (60.0):\nnext_year_return = my_account.send(first_year_return + 1000)\nnext_year_return
    # 123.6\n\nYou can read more about the precise semantics of yield from in PEP
    380.\nOther Methods: close and throw\nThe close method raises GeneratorExit at
    the point the function\nexecution was frozen. This will also be called by __del__
    so you\ncan put any cleanup code where you handle the GeneratorExit:\nmy_account.close()\n\nYou
    can also throw an exception which can be handled in the generator\nor propagated
    back to the user:\nimport sys\ntry:\n    raise ValueError\nexcept:\n    my_manager.throw(*sys.exc_info())\n\nRaises:\nTraceback
    (most recent call last):\n  File \"<stdin>\", line 4, in <module>\n  File \"<stdin>\",
    line 6, in money_manager\n  File \"<stdin>\", line 2, in <module>\nValueError\n\nConclusion\nI
    believe I have covered all aspects of the following question:\n\nWhat does the
    yield keyword do in Python?\n\nIt turns out that yield does a lot. I'm sure I
    could add even more\nthorough examples to this. If you want more or have some
    constructive criticism, let me know by commenting\nbelow.\nAppendix:\nCritique
    of the Top/Accepted Answer**\nIt is confused about what makes an iterable, just
    using a list as an example. See my references above, but in summary: an iterable
    has an __iter__ method returning an iterator. An iterator additionally provides
    a .__next__ method, which is implicitly called by for loops until it raises StopIteration,
    and once it does raise StopIteration, it will continue to do so.\nIt then uses
    a generator expression to describe what a generator is. Since a generator expression
    is simply a convenient way to create an iterator, it only confuses the matter,
    and we still have not yet gotten to the yield part.\nIn Controlling a generator
    exhaustion he calls the .next method (which only works in Python 2), when instead
    he should use the built-in function, next. Calling next(obj) would be an appropriate
    layer of indirection, because his code does not work in Python 3.\nItertools?
    This was not relevant to what yield does at all.\nNo discussion of the methods
    that yield provides along with the new functionality yield from in Python 3.\nThe
    top/accepted answer is a very incomplete answer.\nCritique of answer suggesting
    yield in a generator expression or comprehension.\nThe grammar currently allows
    any expression in a list comprehension.\nexpr_stmt: testlist_star_expr (annassign
    | augassign (yield_expr|testlist) |\n                     ('=' (yield_expr|testlist_star_expr))*)\n...\nyield_expr:
    'yield' [yield_arg]\nyield_arg: 'from' test | testlist\n\nSince yield is an expression,
    it has been touted by some as interesting to use it in comprehensions or generator
    expression - in spite of citing no particularly good use-case.\nThe CPython core
    developers are discussing deprecating its allowance.\nHere's a relevant post from
    the mailing list:\n\nOn 30 January 2017 at 19:05, Brett Cannon  wrote:\n\nOn Sun,
    29 Jan 2017 at 16:39 Craig Rodrigues  wrote:\n\nI'm OK with either approach.  Leaving
    things the way they are in Python 3\nis no good, IMHO.\n\nMy vote is it be a SyntaxError
    since you're not getting what you expect from\nthe syntax.\n\nI'd agree that's
    a sensible place for us to end up, as any code\nrelying on the current behaviour
    is really too clever to be\nmaintainable.\nIn terms of getting there, we'll likely
    want:\nSyntaxWarning or DeprecationWarning in 3.7\nPy3k warning in 2.7.x\nSyntaxError
    in 3.8\nCheers, Nick.\n--  Nick Coghlan   |   ncoghlan at gmail.com   |   Brisbane,
    Australia\n\nFurther, there is an outstanding issue (10544) which seems to be
    pointing in the direction of this never being a good idea (PyPy, a Python implementation
    written in Python, is already raising syntax warnings.)\nBottom line, until the
    developers of CPython tell us otherwise: Don't put yield in a generator expression
    or comprehension.\nThe return statement in a generator\nIn Python 3:\n\nIn a generator
    function, the return statement indicates that the generator is done and will cause
    StopIteration to be raised. The returned value (if any) is used as an argument
    to construct StopIteration and becomes the StopIteration.value attribute.\n\nHistorical
    note, in Python 2:\n\"In a generator function, the return statement is not allowed
    to include an expression_list. In that context, a bare return indicates that the
    generator is done and will cause StopIteration to be raised.\"\nAn expression_list
    is basically any number of expressions separated by commas - essentially, in Python
    2, you can stop the generator with return, but you can't return a value.\n\nFootnotes\nThe
    languages CLU, Sather, and Icon were referenced in the proposal\nto introduce
    the concept of generators to Python. The general idea is\nthat a function can
    maintain an internal state and yield intermediate\ndata points on demand by the
    user. This promised to be superior in performance\nto other approaches, including
    Python threading, which isn't even available on some systems.\n\n This means,
    for example, that range objects aren't Iterators, even though they are iterable,
    because they can be reused. Like lists, their __iter__ methods return iterator
    objects.\n\nyield was originally introduced as a statement, meaning that it\ncould
    only appear at the beginning of a line in a code block.\nNow yield creates a yield
    expression.\nhttps://docs.python.org/2/reference/simple_stmts.html#grammar-token-yield_stmt\nThis
    change was proposed to allow a user to send data into the generator just as\none
    might receive it. To send data, one must be able to assign it to something, and\nfor
    that, a statement just won't work.\n\n"
