- answer_id: '60894764'
  answer_text: "\nThe issue is that python's print() doesn't have a return value,
    meaning it will always return None. eval simply evaluates some expression, and
    returns back the return value from that expression. Since print() returns None,
    an eval of some print statement will also return None.\n\n>>> from_print = print('Hello')\nHello\n>>>
    from_eval = eval(\"print('Hello')\")\nHello\n>>> from_print is from_eval is None\nTrue\n\n\nWhat
    you need is a io stream manager! Here is a possible solution that captures any
    io output and returns that if the expression evaluates to None.\n\nfrom contextlib
    import redirect_stout, redirect_stderr\nfrom io import StringIO\n\n# NOTE: I use
    the arg name `code` since `input` is a python builtin\ndef executecodehelper(code):\n
    \   # Capture all potential output from the code\n    stdout_io = StringIO()\n
    \   stderr_io = StringIO()\n\n    with redirect_stdout(stdout_io), redirect_stderr(stderr_io):\n
    \       # If `code` is already a string, this should work just fine without the
    need for formatting.\n        result = eval(code)\n\n    return result, stdout_io.getvalue(),
    stderr_io.getvalue()\n\ndef executecode(code):\n    result, std_out, std_err =
    executecodehelper(code)\n\n    if result is None:\n        # This code didn't
    return anything. Maybe it printed something?\n        if std_out:\n            return
    std_out.rstrip() # Deal with trailing whitespace\n        elif std_err:\n            return
    std_err.rstrip()\n        else:\n            # Nothing was printed AND the return
    value is None!\n            return None\n    else:\n        return result\n\n\nAs
    a final note, this approach is heavily linked to eval since eval can only evaluate
    a single statement. If you want to extend your bot to multiple line statements,
    you will need to use exec, which changes the logic. Here's a great resource detailing
    the differences between eval and exec: What's the difference between eval, exec,
    and compile?\n    "
  answer_code:
  - |
    >>> from_print = print('Hello')
    Hello
    >>> from_eval = eval("print('Hello')")
    Hello
    >>> from_print is from_eval is None
    True
  - |
    from contextlib import redirect_stout, redirect_stderr
    from io import StringIO

    # NOTE: I use the arg name `code` since `input` is a python builtin
    def executecodehelper(code):
        # Capture all potential output from the code
        stdout_io = StringIO()
        stderr_io = StringIO()

        with redirect_stdout(stdout_io), redirect_stderr(stderr_io):
            # If `code` is already a string, this should work just fine without the need for formatting.
            result = eval(code)

        return result, stdout_io.getvalue(), stderr_io.getvalue()

    def executecode(code):
        result, std_out, std_err = executecodehelper(code)

        if result is None:
            # This code didn't return anything. Maybe it printed something?
            if std_out:
                return std_out.rstrip() # Deal with trailing whitespace
            elif std_err:
                return std_err.rstrip()
            else:
                # Nothing was printed AND the return value is None!
                return None
        else:
            return result
