  answer_text: "\nThe most common method used to concatenate lists are the plus operator
    and the built-in method append, for example:\nlist = [1,2]\n\nlist = list + [3]\n#
    list = [1,2,3]\n\nlist.append(3)\n# list = [1,2,3]\n\nlist.append([3,4])\n# list
    = [1,2,[3,4]]\n\nFor most of the cases, this will work, but the append function
    will not extend a list if one was added. Because that is not expected, you can
    use another method called extend. It should work with structures:\nlist = [1,2]\nlist.extend([3,4])\n#
    list = [1,2,3,4]\n\n    "
  answer_code:
  - |
    list = [1,2]

    list = list + [3]
    # list = [1,2,3]

    list.append(3)
    # list = [1,2,3]

    list.append([3,4])
    # list = [1,2,[3,4]]
  - |
    list = [1,2]
    list.extend([3,4])
    # list = [1,2,3,4]
