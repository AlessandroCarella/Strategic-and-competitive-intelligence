  answer_text: "\nUse the + operator to combine the lists:\nlistone = [1, 2, 3]\nlisttwo
    = [4, 5, 6]\n\njoinedlist = listone + listtwo\n\nOutput:\n>>> joinedlist\n[1,
    2, 3, 4, 5, 6]\n\nNOTE: This will create a new list with a shallow copy of the
    items in the first list, followed by a shallow copy of the items in the second
    list. Use copy.deepcopy() to get deep copies of lists.\n    "
