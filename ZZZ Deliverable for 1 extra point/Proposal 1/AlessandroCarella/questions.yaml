  answer_text: "\nSo there are two easy ways.\n\nUsing +: It creates a new list from
    provided lists\nExample:\n\nIn [1]: a = [1, 2, 3]\n\nIn [2]: b = [4, 5, 6]\n\nIn
    [3]: a + b\nOut[3]: [1, 2, 3, 4, 5, 6]\n\nIn [4]: %timeit a + b\n10000000 loops,
    best of 3: 126 ns per loop\n\n\nUsing extend: It appends new list to existing
    list. That means it does not create a separate list.\nExample:\n\nIn [1]: a =
    [1, 2, 3]\n\nIn [2]: b = [4, 5, 6]\n\nIn [3]: %timeit a.extend(b)\n10000000 loops,
    best of 3: 91.1 ns per loop\n\n\nThus we see that out of two of most popular methods,
    extend is efficient.\n    "
  answer_code:
