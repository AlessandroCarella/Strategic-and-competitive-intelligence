  answer_text: "\nHere are some Python examples of how to actually implement generators
    as if Python did not provide syntactic sugar for them:\n\nAs a Python generator:\n\nfrom
    itertools import islice\n\ndef fib_gen():\n    a, b = 1, 1\n    while True:\n
    \       yield a\n        a, b = b, a + b\n\nassert [1, 1, 2, 3, 5] == list(islice(fib_gen(),
    5))\n\n\nUsing lexical closures instead of generators\n\ndef ftake(fnext, last):\n
    \   return [fnext() for _ in xrange(last)]\n\ndef fib_gen2():\n    #funky scope
    due to python2.x workaround\n    #for python 3.x use nonlocal\n    def _():\n
    \       _.a, _.b = _.b, _.a + _.b\n        return _.a\n    _.a, _.b = 0, 1\n    return
    _\n\nassert [1,1,2,3,5] == ftake(fib_gen2(), 5)\n\n\nUsing object closures instead
