  answer_text: "\nThink of it this way:\n\nAn iterator is just a fancy sounding term
    for an object that has a next() method.  So a yield-ed function ends up being
    something like this:\n\nOriginal version:\n\ndef some_function():\n    for i in
    xrange(4):\n        yield i\n\nfor i in some_function():\n    print i\n\n\nThis
    is basically what the Python interpreter does with the above code:\n\nclass it:\n
    \   def __init__(self):\n        # Start at -1 so that we get 0 when we add 1
    below.\n        self.count = -1\n\n    # The __iter__ method will be called once
    by the 'for' loop.\n    # The rest of the magic happens on the object returned
    by this method.\n    # In this case it is the object itself.\n    def __iter__(self):\n
    \       return self\n\n    # The next method will be called repeatedly by the
    'for' loop\n    # until it raises StopIteration.\n    def next(self):\n        self.count
    += 1\n        if self.count < 4:\n            return self.count\n        else:\n
    \           # A StopIteration exception is raised\n            # to signal that
    the iterator is done.\n            # This is caught implicitly by the 'for' loop.\n
    \           raise StopIteration\n\ndef some_func():\n    return it()\n\nfor i
    in some_func():\n    print i\n\n\nFor more insight as to what's happening behind
    the scenes, the for loop can be rewritten to this:\n\niterator = some_func()\ntry:\n
    \   while 1:\n        print iterator.next()\nexcept StopIteration:\n    pass\n\n\nDoes
    that make more sense or just confuse you more?  :)\n\nI should note that this
    is an oversimplification for illustrative purposes. :)\n    "
  answer_code:
  - |
    def some_function():
        for i in xrange(4):
            yield i

    for i in some_function():
        print i
  - |
    class it:
        def __init__(self):
            # Start at -1 so that we get 0 when we add 1 below.
            self.count = -1

        # The __iter__ method will be called once by the 'for' loop.
        # The rest of the magic happens on the object returned by this method.
        # In this case it is the object itself.
        def __iter__(self):
            return self

        # The next method will be called repeatedly by the 'for' loop
        # until it raises StopIteration.
        def next(self):
            self.count += 1
            if self.count < 4:
                return self.count
            else:
                # A StopIteration exception is raised
                # to signal that the iterator is done.
                # This is caught implicitly by the 'for' loop.
                raise StopIteration

    def some_func():
        return it()

    for i in some_func():
        print i
  - |
    iterator = some_func()
    try:
        while 1:
            print iterator.next()
    except StopIteration:
        pass
