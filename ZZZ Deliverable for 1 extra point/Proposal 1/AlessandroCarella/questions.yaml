  answer_text: "\n\nThe yield keyword is reduced to two simple facts:\nIf the compiler
    detects the yield keyword anywhere inside a function, that function no longer
    returns via the return statement. Instead, it immediately returns a lazy \"pending
    list\" object called a generator\nA generator is iterable. What is an iterable?
    It's anything like a list, set, range, dictionary view, or any other object with
    a built-in protocol for visiting each element in a certain order.\nIn a nutshell:
    Most commonly, a generator is a lazy, incrementally-pending list, and yield statements
    allow you to use function notation to program the list values the generator should
    incrementally spit out. Furthermore, advanced usage lets you use generators as
    coroutines (see below).\ngenerator = myYieldingFunction(...)  # basically a list
    (but lazy)\nx = list(generator)  # evaluate every element into a list\n\n   generator\n
    \      v\n[x[0], ..., ???]\n\n         generator\n             v\n[x[0], x[1],
    ..., ???]\n\n               generator\n                   v\n[x[0], x[1], x[2],
    ..., ???]\n\n                       StopIteration exception\n[x[0], x[1], x[2]]
    \    done\n\nBasically, whenever the yield statement is encountered, the function
    pauses and saves its state, then emits \"the next return value in the 'list'\"
    according to the python iterator protocol (to some syntactic construct like a
    for-loop that repeatedly calls next() and catches a StopIteration exception, etc.).
    You might have encountered generators with generator expressions; generator functions
    are more powerful because you can pass arguments back into the paused generator
    function, using them to implement coroutines. More on that later.\nBasic Example
    ('list')\nLet's define a function makeRange that's just like Python's range. Calling
    makeRange(n) RETURNS A GENERATOR:\ndef makeRange(n):\n    # return 0,1,2,...,n-1\n
    \   i = 0\n    while i < n:\n        yield i\n        i += 1\n\n>>> makeRange(5)\n<generator
    object makeRange at 0x19e4aa0>\n\nTo force the generator to immediately return
    its pending values, you can pass it into list() (just like you could any iterable):\n>>>
    list(makeRange(5))\n[0, 1, 2, 3, 4]\n\nComparing the example to \"just returning
    a list\"\nThe above example can be thought of as merely creating a list that you
    append to and return:\n# return a list                  #  # return a generator\ndef
    makeRange(n):                #  def makeRange(n):\n    \"\"\"return [0,1,2,...,n-1]\"\"\"
    #      \"\"\"return 0,1,2,...,n-1\"\"\"\n    TO_RETURN = []               # \n
    \   i = 0                        #      i = 0\n    while i < n:                 #
    \     while i < n:\n        TO_RETURN += [i]         #          yield i\n        i
    += 1                   #          i += 1\n    return TO_RETURN             # \n\n>>>
    makeRange(5)\n[0, 1, 2, 3, 4]\n\nThere is one major difference, though; see the
    last section.\nHow you might use generators\nAn iterable is the last part of a
    list comprehension, and all generators are iterable, so they're often used like
    so:\n#                  < ITERABLE >\n>>> [x+10 for x in makeRange(5)]\n[10, 11,
    12, 13, 14]\n\nTo get a better feel for generators, you can play around with the
    itertools module (be sure to use chain.from_iterable rather than chain when warranted).
    For example, you might even use generators to implement infinitely-long lazy lists
    like itertools.count(). You could implement your own def enumerate(iterable):
    zip(count(), iterable), or alternatively do so with the yield keyword in a while-loop.\nPlease
    note: generators can actually be used for many more things, such as implementing
    coroutines, non-deterministic programming, and other elegant things. However,
    the \"lazy lists\" viewpoint I present here is the most common use you will find.\nBehind
    the scenes\nThis is how the \"Python iteration protocol\" works. That is, what
    is going on when you do list(makeRange(5)). This is what I describe earlier as
    a \"lazy, incremental list\".\n>>> x=iter(range(5))\n>>> next(x)  # calls x.__next__();
    x.next() is deprecated\n0\n>>> next(x)\n1\n>>> next(x)\n2\n>>> next(x)\n3\n>>>
    next(x)\n4\n>>> next(x)\nTraceback (most recent call last):\n  File \"<stdin>\",
    line 1, in <module>\nStopIteration\n\nThe built-in function next() just calls
    the objects .__next__() function, which is a part of the \"iteration protocol\"
    and is found on all iterators. You can manually use the next() function (and other
    parts of the iteration protocol) to implement fancy things, usually at the expense
    of readability, so try to avoid doing that...\nCoroutines\nCoroutine example:\ndef
    interactiveProcedure():\n    userResponse = yield makeQuestionWebpage()\n    print('user
    response:', userResponse)\n    yield 'success'\n\ncoroutine = interactiveProcedure()\nwebFormData
    = next(coroutine)  # same as .send(None)\nuserResponse = serveWebForm(webFormData)\n\n#
    ...at some point later on web form submit...\n\nsuccessStatus = coroutine.send(userResponse)\n\nA
    coroutine (generators that generally accept input via the yield keyword e.g. nextInput
    = yield nextOutput, as a form of two-way communication) is basically a computation
    that is allowed to pause itself and request input (e.g. to what it should do next).
    When the coroutine pauses itself (when the running coroutine eventually hits a
    yield keyword), the computation is paused and control is inverted (yielded) back
    to the 'calling' function (the frame which requested the next value of the computation).
    The paused generator/coroutine remains paused until another invoking function
    (possibly a different function/context) requests the next value to unpause it
    (usually passing input data to direct the paused logic interior to the coroutine's
    code).\nYou can think of Python coroutines as lazy incrementally-pending lists,
    where the next element doesn't just depend on the previous computation but also
    on input that you may opt to inject during the generation process.\nMinutiae\nNormally,
    most people would not care about the following distinctions and probably want
    to stop reading here.\nIn Python-speak, an iterable is any object which \"understands
    the concept of a for-loop\" like a list [1,2,3], and an iterator is a specific
    instance of the requested for-loop like [1,2,3].__iter__(). A generator is exactly
    the same as any iterator, except for the way it was written (with function syntax).\nWhen
    you request an iterator from a list, it creates a new iterator. However, when
    you request an iterator from an iterator (which you would rarely do), it just
    gives you a copy of itself.\nThus, in the unlikely event that you are failing
    to do something like this...\n> x = myRange(5)\n> list(x)\n[0, 1, 2, 3, 4]\n>
    list(x)\n[]\n\n... then remember that a generator is an iterator; that is, it
    is one-time-use. If you want to reuse it, you should call myRange(...) again.
    If you need to use the result twice, convert the result to a list and store it
    in a variable x = list(myRange(5)). Those who absolutely need to clone a generator
    (for example, who are doing terrifyingly hackish metaprogramming) can use itertools.tee
    (still works in Python 3) if absolutely necessary, since the copyable iterator
    Python PEP standards proposal has been deferred.\n    "
