  answer_comments:
  - comment_text: yield is not as magical this answer suggests. When you call a function
      that contains a yield statement anywhere, you get a generator object, but no
      code runs. Then each time you extract an object from the generator, Python executes
      code in the function until it comes to a yield statement, then pauses and delivers
      the object. When you extract another object, Python resumes just after the yield
      and continues until it reaches another yield (often the same one, but one iteration
      later). This continues until the function runs off the end, at which point the
      generator is deemed exhausted.
    comment_user: Matthias Fripp
  - comment_text: '"These iterables are handy... but you store all the values in memory
      and this is not always what you want", is either wrong or confusing. An iterable
      returns an iterator upon calling the iter() on the iterable, and an iterator
      doesn''t always have to store its values in memory, depending on the implementation
      of the iter method, it can also generate values in the sequence on demand.'
