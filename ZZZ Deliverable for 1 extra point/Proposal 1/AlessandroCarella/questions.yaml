- answer_id: '14352675'
  answer_text: "\nYield gives you a generator. \n\ndef get_odd_numbers(i):\n    return
    range(1, i, 2)\ndef yield_odd_numbers(i):\n    for x in range(1, i, 2):\n       yield
    x\nfoo = get_odd_numbers(10)\nbar = yield_odd_numbers(10)\nfoo\n[1, 3, 5, 7, 9]\nbar\n<generator
    object yield_odd_numbers at 0x1029c6f50>\nbar.next()\n1\nbar.next()\n3\nbar.next()\n5\n\n\nAs
    you can see, in the first case foo holds the entire list in memory at once. It's
    not a big deal for a list with 5 elements, but what if you want a list of 5 million?
    Not only is this a huge memory eater, it also costs a lot of time to build at
    the time that the function is called.\n\nIn the second case, bar just gives you
    a generator. A generator is an iterable--which means you can use it in a for loop,
    etc, but each value can only be accessed once. All the values are also not stored
    in memory at the same time; the generator object \"remembers\" where it was in
    the looping the last time you called it--this way, if you're using an iterable
    to (say) count to 50 billion, you don't have to count to 50 billion all at once
    and store the 50 billion numbers to count through.\n\nAgain, this is a pretty
    contrived example, you probably would use itertools if you really wanted to count
    to 50 billion. :)\n\nThis is the most simple use case of generators. As you said,
    it can be used to write efficient permutations, using yield to push things up
    through the call stack instead of using some sort of stack variable. Generators
    can also be used for specialized tree traversal, and all manner of other things.\n
    \   "
  answer_code: |
    def get_odd_numbers(i):
        return range(1, i, 2)
    def yield_odd_numbers(i):
        for x in range(1, i, 2):
           yield x
    foo = get_odd_numbers(10)
    bar = yield_odd_numbers(10)
    foo
    [1, 3, 5, 7, 9]
    bar
    <generator object yield_odd_numbers at 0x1029c6f50>
    bar.next()
    1
    bar.next()
    3
    bar.next()
    5
