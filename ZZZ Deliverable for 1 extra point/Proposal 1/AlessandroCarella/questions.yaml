answers_number: 1.0
answers:
- answer_id: '26205391'
  answer_text: "\nYour question covers two problems:\n\nWhy does DAQmxBaseCfgSampClkTiming
    return an error?\nWithout using that function, why isn't any output generated?\n1.
    Hardware vs Software Timing\n\n\n  rjb3 wrote:\n  \n  \n    The function throws
    an error when I try to configure the clock. When I do not there is no error but
    nor is there voltage generated on the output.\n  \n\n\nYour program receives the
    error because the USB 600x devices do not support hardware-timed analog output
    [1]:\n\n\n  \n    The NI USB-6008/6009 has two independent analog output channels
    that can generate outputs from 0 to 5 V. All updates of analog output channels
    are software-timed. GND is the ground-reference signal for the analog output channels.\n
    \ \n\n\n\"Software-timed\" means a sample is written on demand by the program
    whenever DAQmxBaseWriteAnalogF64 is called. If an array of samples is written,
    then that array is written one at a time. You can learn more about how NI defines
    timing from the DAQmx help [2]. While that document is for DAQmx, the same concepts
    apply to DAQmx Base since the behavior is defined by the devices and not their
    drivers. The differences are in how much of the hardware's capabilities are implemented
    by the driver -- DAQmx implements everything, while DAQmx Base is a small select
    subset.\n\n2. No Output When Software Timed\n\n\n  rjb3 wrote:\n  \n  \n    When
    I do not there is no error but nor is there voltage generated on the output.\n
    \ \n\n\nI am not familiar with the Python bindings for the DAQmx Base API, but
    I can recommend two things:\n\nTry using the installed genVoltage.c C example
    and confirm that you can see voltage on the ao channel.\nExamples are installed
    here: /Applications/National Instruments/NI-DAQmx Base/examples\nIf you see output,
    you've confirmed that the device and driver are working correctly, and that the
    bug is likely in the python file.\nIf you don't see output, then the device or
    driver has a problem, and the best place to get help troubleshooting is the NI
    discussion forums at http://forums.ni.com.\n\nTry porting genVoltage.c using the
    python bindings. At first glance, I would try:\nUse DAQmxBaseStartTask before
    DAQmxBaseWriteAnalogF64\nOr set the autostart parameter in your call to DAQmxBaseWriteAnalogF64
    to true.\n\nReferences\n\n[1] NI USB-6008/6009 User Guide And Specifications ::
    Analog Output (page 16)\nhttp://digital.ni.com/manuals.nsf/websearch/CE26701AA052E1F0862579AD0053BE19\n\n[2]
    Timing, Hardware Versus Software\nhttp://zone.ni.com/reference/en-XX/help/370466V-01/TOC11.htm\n
    \   "
