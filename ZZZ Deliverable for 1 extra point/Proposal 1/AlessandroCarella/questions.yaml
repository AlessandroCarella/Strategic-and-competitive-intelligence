  answer_text: "\nLike every answer suggests, yield is used for creating a sequence
    generator. It's used for generating some sequence dynamically. For example, while
    reading a file line by line on a network, you can use the yield function as follows:\n\ndef
    getNextLines():\n   while con.isOpen():\n       yield con.read()\n\n\nYou can
    use it in your code as follows:\n\nfor line in getNextLines():\n    doSomeThing(line)\n\n\nExecution
    Control Transfer gotcha\n\nThe execution control will be transferred from getNextLines()
    to the for loop when yield is executed. Thus, every time getNextLines() is invoked,
    execution begins from the point where it was paused last time.\n\nThus in short,
    a function with the following code\n\ndef simpleYield():\n    yield \"first time\"\n
    \   yield \"second time\"\n    yield \"third time\"\n    yield \"Now some useful
    value {}\".format(12)\n\nfor i in simpleYield():\n    print i\n\n\nwill print\n\n\"first
    time\"\n\"second time\"\n\"third time\"\n\"Now some useful value 12\"\n\n    "
  answer_code:
  - |
    def getNextLines():
       while con.isOpen():
           yield con.read()
  - |
    for line in getNextLines():
        doSomeThing(line)
  - |
    def simpleYield():
        yield "first time"
        yield "second time"
        yield "third time"
        yield "Now some useful value {}".format(12)

    for i in simpleYield():
        print i
  - |
