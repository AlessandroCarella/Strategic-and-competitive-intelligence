  answer_text: "\nWith Python 3.3+ you can use yield from:\n\nlistone = [1,2,3]\nlisttwo
    = [4,5,6]\n\ndef merge(l1, l2):\n    yield from l1\n    yield from l2\n\n>>> list(merge(listone,
    listtwo))\n[1, 2, 3, 4, 5, 6]\n\n\nOr, if you want to support an arbitrary number
    of iterators:\n\ndef merge(*iters):\n    for it in iters:\n        yield from
    it\n\n>>> list(merge(listone, listtwo, 'abcd', [20, 21, 22]))\n[1, 2, 3, 4, 5,
    6, 'a', 'b', 'c', 'd', 20, 21, 22]\n\n    "
  answer_code:
  - |
    listone = [1,2,3]
    listtwo = [4,5,6]

    def merge(l1, l2):
        yield from l1
        yield from l2

    >>> list(merge(listone, listtwo))
    [1, 2, 3, 4, 5, 6]
  - |
    def merge(*iters):
        for it in iters:
            yield from it

    >>> list(merge(listone, listtwo, 'abcd', [20, 21, 22]))
    [1, 2, 3, 4, 5, 6, 'a', 'b', 'c', 'd', 20, 21, 22]
