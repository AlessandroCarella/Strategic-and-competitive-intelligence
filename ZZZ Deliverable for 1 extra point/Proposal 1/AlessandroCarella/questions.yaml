  answer_text: "\n(My below answer only speaks from the perspective of using Python
    generator, not the underlying implementation of generator mechanism, which involves
    some tricks of stack and heap manipulation.)\n\nWhen yield is used instead of
    a return in a python function, that function is turned into something special
    called generator function. That function will return an object of generator type.
    The yield keyword is a flag to notify the python compiler to treat such function
    specially. Normal functions will terminate once some value is returned from it.
    But with the help of the compiler, the generator function can be thought of as
    resumable. That is, the execution context will be restored and the execution will
    continue from last run. Until you explicitly call return, which will raise a StopIteration
    exception (which is also part of the iterator protocol), or reach the end of the
    function. I found a lot of references about generator but this one from the functional
    programming perspective is the most digestable.\n\n(Now I want to talk about the
    rationale behind generator, and the iterator based on my own understanding. I
    hope this can help you grasp the essential motivation of iterator and generator.
    Such concept shows up in other languages as well such as C#.)\n\nAs I understand,
    when we want to process a bunch of data, we usually first store the data somewhere
    and then process it one by one. But this naive approach is problematic. If the
    data volume is huge, it's expensive to store them as a whole beforehand. So instead
    of storing the data itself directly, why not store some kind of metadata indirectly,
    i.e. the logic how the data is computed. \n\nThere are 2 approaches to wrap such
    metadata.\n\nThe OO approach, we wrap the metadata as a class. This is the so-called
    iterator who implements the iterator protocol (i.e. the __next__(), and __iter__()
    methods). This is also the commonly seen iterator design pattern.\nThe functional
    approach, we wrap the metadata as a function. This is\nthe so-called generator
    function. But under the hood, the returned generator object still IS-A iterator
    because it also implements the iterator protocol.\nEither way, an iterator is
    created, i.e. some object that can give you the data you want. The OO approach
    may be a bit complex. Anyway, which one to use is up to you.\n    "
  answer_code: []
