      per minute?   I'm considering integrating it into my Chatbot application.
    comment_user: Omar Saade
  - comment_text: Please see pricing page cloud.google.com/vertex-ai/docs/generative-ai/…
    comment_user: Gang Chen
question_title: Improve Document AI generative AI accuracy?
question_votes: 0.0
question_text: I am creating a Document AI Custom Processor on Google Cloud Platform.
  I have been using the pre-trained foundation model to auto-label documents as I
  import them. However, it is not clear to me if labeling more documents will improve
  the performance of a Generative AI (as opposed to custom) processor, or if labeling
  documents will only improve the performance of custom trained models?
question_code: []
answers_number: 1.0
answers:
- answer_id: '77828953'
  answer_text: "\nThe best way to improve the labeling is through uptraining the processor.
    I like to use the model based method, just note you need 20 instances of every
    label (10 test, 10 training) to uptrain using this method (google recommends 50
    each). If needed, you can upload duplicates to get to the minimum requirement,
    but i dont recommend this since it will lead to a lower F1 score. the more documents
    the better, so i like to uptrain once i can, then continue to import more docs
    and uptrain (about every 50 new docs). Uptrain by going to build>manage dataset>
    train new version. If the documents come in different formats, try to have 20
    documents minimum per format\n    "
  answer_code: []
  answer_votes: 1
  answer_num_comments: []
  answer_comments:
  - comment_text: 'Thanks for your reply! Based on the results I am seeing, it does
      not seem like any uptraining of the pretrained foundation Generative AI model
      takes place when I train a new custom model (which is my question really). Instead
      it seems to generate a completely new model which has vastly different results
      than the foundation model. Note: I am differentiating between models that are
      labeled as ''Custom'' and ''Generative AI'' respectively under ''Type'' on the
      Deploy & Use tab of a Document AI processor.'
    comment_user: Filip Östermark
question_title: Using VertexAI (Google Generative AI) in Golang
question_votes: 2.0
question_text: |-
  I am implementing this curl request in golang for connecting to vertexi generative AI models.
  I am using the token generated by this command for authentication gcloud auth print-access-token.
  But the token doesn't last for more than 1 hour.
question_code: |
  API_ENDPOINT="**-****-aiplatform.googleapis.com"
  PROJECT_ID="******"
  MODEL_ID="text-bison@001"

  curl \
  -X POST \
  -H "Authorization: Bearer $(gcloud auth print-access-token)" \
  -H "Content-Type: application/json" \
  "https://${API_ENDPOINT}/v1/projects/${PROJECT_ID}/locations/us-central1/publishers/google/models/${MODEL_ID}:predict" -d \
  $'{
      "instances": [
          {
              "content": ""
          }
      ],
      "parameters": {
          "temperature": 0.2,
          "maxOutputTokens": 256,
          "topP": 0.8,
          "topK": 40
      }
  }'
