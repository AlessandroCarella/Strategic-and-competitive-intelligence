    actually have to terminate. I've written code like this:\n\ndef fib():\n    last,
    cur = 0, 1\n    while True: \n        yield cur\n        last, cur = cur, last
    + cur\n\n\nThen I can use it in other code like this:\n\nfor f in fib():\n    if
    some_condition: break\n    coolfuncs(f);\n\n\nIt really helps simplify some problems,
    and makes some things easier to work with. \n    "
