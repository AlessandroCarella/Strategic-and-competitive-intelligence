  answer_text: "\nHere is an example in plain language. I will provide a correspondence
    between high-level human concepts to low-level Python concepts.\nI want to operate
    on a sequence of numbers, but I don't want to bother myself with the creation
    of that sequence, I want only to focus on the operation I want to do. So, I do
    the following:\nI call you and tell you that I want a sequence of numbers that
    are calculated in a specific way, and I let you know what the algorithm is. This
    step corresponds to defining the generator function, i.e. the function containing
    a yield.\nSometime later, I tell you, \"OK, get ready to tell me the sequence
    of numbers\". This step corresponds to calling the generator function which returns
    a generator object. Note that you don't tell me any numbers yet; you just grab
    your paper and pencil.\nI ask you, \"Tell me the next number\", and you tell me
    the first number; after that, you wait for me to ask you for the next number.
    It's your job to remember where you were, what numbers you have already said,
    and what is the next number. I don't care about the details. This step corresponds
    to calling next(generator) on the generator object.\n(In Python 2, .next was a
    method of the generator object; in Python 3, it is named .__next__, but the proper
    way to call it is using the builtin next() function just like len() and .__len__)\n…
    repeat the previous step, until…\neventually, you might come to an end. You don't
    tell me a number; you just shout, \"Hold your horses! I'm done! No more numbers!\"
    This step corresponds to the generator object ending its job, and raising a StopIteration
    exception.\nThe generator function does not need to raise the exception. It's
    raised automatically when the function ends or issues a return.\nThis is what
    a generator does (a function that contains a yield); it starts executing on the
    first next(), pauses whenever it does a yield, and when asked for the next() value
    it continues from the point it was last. It fits perfectly by design with the
    iterator protocol of Python, which describes how to sequentially request values.\nThe
    most famous user of the iterator protocol is the for command in Python. So, whenever
    you do a:\nfor item in sequence:\n\nit doesn't matter if sequence is a list, a
    string, a dictionary or a generator object like described above; the result is
    the same: you read items off a sequence one by one.\nNote that defining a function
    that contains a yield keyword is not the only way to create a generator; it's
    just the easiest way to create one.\nFor more accurate information, read about
    iterator types, the yield statement, and generators in the Python documentation.\n
    \   "
  answer_code: |
    for item in sequence:
