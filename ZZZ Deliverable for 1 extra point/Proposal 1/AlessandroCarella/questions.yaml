  answer_text: "\nYou could also just use sum.\n>>> a = [1, 2, 3]\n>>> b = [4, 5,
    6]\n>>> sum([a, b], [])\n[1, 2, 3, 4, 5, 6]\n>>>\n\nThis works for any length
    and any element type of list:\n>>> a = ['a', 'b', 'c', 'd']\n>>> b = [1, 2, 3,
    4]\n>>> c = [1, 2]\n>>> sum([a, b, c], [])\n['a', 'b', 'c', 'd', 1, 2, 3, 4, 1,
    2]\n>>>\n\nThe reason I add [], is because the start argument is set to 0 by default,
    so it loops through the list and adds to start, but 0 + [1, 2, 3] would give an
    error, so if we set the start to []. It would add to [], and [] + [1, 2, 3] would
    work as expected.\n    "
  answer_code:
