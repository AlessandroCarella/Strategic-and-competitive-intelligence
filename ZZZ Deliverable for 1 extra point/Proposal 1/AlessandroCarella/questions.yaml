  answer_text: "\nHere is a mental image of what yield does.\n\nI like to think of
    a thread as having a stack (even when it's not implemented that way).\n\nWhen
    a normal function is called, it puts its local variables on the stack, does some
    computation, then clears the stack and returns. The values of its local variables
    are never seen again.\n\nWith a yield function, when its code begins to run (i.e.
    after the function is called, returning a generator object, whose next() method
    is then invoked), it similarly puts its local variables onto the stack and computes
    for a while. But then, when it hits the yield statement, before clearing its part
    of the stack and returning, it takes a snapshot of its local variables and stores
    them in the generator object. It also writes down the place where it's currently
    up to in its code (i.e. the particular yield statement).\n\nSo it's a kind of
    a frozen function that the generator is hanging onto.\n\nWhen next() is called
    subsequently, it retrieves the function's belongings onto the stack and re-animates
    it. The function continues to compute from where it left off, oblivious to the
    fact that it had just spent an eternity in cold storage.\n\nCompare the following
    examples:\n\ndef normalFunction():\n    return\n    if False:\n        pass\n\ndef
    yielderFunction():\n    return\n    if False:\n        yield 12\n\n\nWhen we call
    the second function, it behaves very differently to the first. The yield statement
    might be unreachable, but if it's present anywhere, it changes the nature of what
    we're dealing with.\n\n>>> yielderFunction()\n<generator object yielderFunction
    at 0x07742D28>\n\n\nCalling yielderFunction() doesn't run its code, but makes
    a generator out of the code. (Maybe it's a good idea to name such things with
    the yielder prefix for readability.)\n\n>>> gen = yielderFunction()\n>>> dir(gen)\n['__class__',\n
    ...\n '__iter__',    #Returns gen itself, to make it work uniformly with containers\n
    ...            #when given to a for loop. (Containers return an iterator instead.)\n
    'close',\n 'gi_code',\n 'gi_frame',\n 'gi_running',\n 'next',        #The method
    that runs the function's body.\n 'send',\n 'throw']\n\n\nThe gi_code and gi_frame
    fields are where the frozen state is stored. Exploring them with dir(..), we can
    confirm that our mental model above is credible.\n    "
  answer_code:
  - |
    def normalFunction():
        return
        if False:
            pass

    def yielderFunction():
        return
        if False:
            yield 12
  - |
    >>> yielderFunction()
    <generator object yielderFunction at 0x07742D28>
  - |
    >>> gen = yielderFunction()
    >>> dir(gen)
    ['__class__',
     ...
     '__iter__',    #Returns gen itself, to make it work uniformly with containers
     ...            #when given to a for loop. (Containers return an iterator instead.)
     'close',
     'gi_code',
     'gi_frame',
     'gi_running',
     'next',        #The method that runs the function's body.
     'send',
     'throw']
