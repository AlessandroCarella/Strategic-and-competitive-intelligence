  answer_text: "\nPython >= 3.5 alternative: [*l1, *l2]\nAnother alternative has been
    introduced via the acceptance of PEP 448 which deserves mentioning.\nThe PEP,
    titled Additional Unpacking Generalizations, generally reduced some syntactic
    restrictions when using the starred * expression in Python; with it, joining two
    lists (applies to any iterable) can now also be done with:\n>>> l1 = [1, 2, 3]\n>>>
    l2 = [4, 5, 6]\n>>> joined_list = [*l1, *l2]  # unpack both iterables in a list
    literal\n>>> print(joined_list)\n[1, 2, 3, 4, 5, 6]\n\nThis functionality was
    defined for Python 3.5, but it hasn't been backported to previous versions in
    the 3.x family. In unsupported versions a SyntaxError is going to be raised.\nAs
    with the other approaches, this too creates as shallow copy of the elements in
    the corresponding lists.\nThe upside to this approach is that you really don't
    need lists in order to perform it; anything that is iterable will do. As stated
    in the PEP:\n\nThis is also useful as a more readable way of summing iterables
    into a\nlist, such as my_list + list(my_tuple) + list(my_range) which is now\nequivalent
    to just [*my_list, *my_tuple, *my_range].\n\nSo while addition with + would raise
    a TypeError due to type mismatch:\nl = [1, 2, 3]\nr = range(4, 7)\nres = l + r\n\nThe
    following won't:\nres = [*l, *r]\n\nbecause it will first unpack the contents
    of the iterables and then simply create a list from the contents.\n    "
  answer_code:
  - |
    >>> l1 = [1, 2, 3]
    >>> l2 = [4, 5, 6]
    >>> joined_list = [*l1, *l2]  # unpack both iterables in a list literal
    >>> print(joined_list)
    [1, 2, 3, 4, 5, 6]
  - |
    l = [1, 2, 3]
    r = range(4, 7)
    res = l + r
  - |
    res = [*l, *r]
