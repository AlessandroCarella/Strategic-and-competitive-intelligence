  answer_text: "\nWhile a lot of answers show why you'd use a yield to create a generator,
    there are more uses for yield.  It's quite easy to make a coroutine, which enables
    the passing of information between two blocks of code.  I won't repeat any of
    the fine examples that have already been given about using yield to create a generator.\n\nTo
    help understand what a yield does in the following code, you can use your finger
    to trace the cycle through any code that has a yield.  Every time your finger
    hits the yield, you have to wait for a next or a send to be entered.  When a next
    is called, you trace through the code until you hit the yield… the code on the
    right of the yield is evaluated and returned to the caller… then you wait.  When
    next is called again, you perform another loop through the code.  However, you'll
    note that in a coroutine, yield can also be used with a send… which will send
    a value from the caller into the yielding function. If a send is given, then yield
    receives the value sent, and spits it out the left hand side… then the trace through
    the code progresses until you hit the yield again (returning the value at the
    end, as if next was called).\n\nFor example:\n\n>>> def coroutine():\n...     i
    = -1\n...     while True:\n...         i += 1\n...         val = (yield i)\n...
    \        print(\"Received %s\" % val)\n...\n>>> sequence = coroutine()\n>>> sequence.next()\n0\n>>>
    sequence.next()\nReceived None\n1\n>>> sequence.send('hello')\nReceived hello\n2\n>>>
    sequence.close()\n\n    "
  answer_code: |
    >>> def coroutine():
    ...     i = -1
    ...     while True:
    ...         i += 1
    ...         val = (yield i)
    ...         print("Received %s" % val)
    ...
    >>> sequence = coroutine()
    >>> sequence.next()
    0
    >>> sequence.next()
    Received None
    1
    >>> sequence.send('hello')
    Received hello
    2
    >>> sequence.close()
