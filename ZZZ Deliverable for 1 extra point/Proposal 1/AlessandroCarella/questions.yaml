    __init__(self):\n        self.a, self.b = 1, 1\n\n    def __call__(self):\n        r
    = self.a\n        self.a, self.b = self.b, self.a + self.b\n        return r\n\nassert
    [1,1,2,3,5] == ftake(fib_gen3(), 5)\n\n    "
