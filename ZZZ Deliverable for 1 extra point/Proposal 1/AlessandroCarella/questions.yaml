  - comment_text: The yield statement suspends function’s execution and sends a value
      back to the caller, but retains enough state to enable function to resume where
      it is left off. When resumed, the function continues execution immediately after
      the last yield run. This allows its code to produce a series of values over
      time, rather than computing them at once and sending them back like a list.
    comment_user: Jacob Ward
- answer_id: '237028'
  answer_text: "\nShortcut to understanding yield\nWhen you see a function with yield
    statements, apply this easy trick to understand what will happen:\nInsert a line
    result = [] at the start of the function.\nReplace each yield expr with result.append(expr).\nInsert
    a line return result at the bottom of the function.\nYay - no more yield statements!
    Read and figure out the code.\nCompare the function to the original definition.\nThis
    trick may give you an idea of the logic behind the function, but what actually
    happens with yield is significantly different than what happens in the list-based
    approach. In many cases, the yield approach will be a lot more memory efficient
    and faster too. In other cases, this trick will get you stuck in an infinite loop,
    even though the original function works just fine. Read on to learn more...\nDon't
    confuse your iterables, iterators, and generators\nFirst, the iterator protocol
    - when you write\nfor x in mylist:\n    ...loop body...\n\nPython performs the
    following two steps:\nGets an iterator for mylist:\nCall iter(mylist) -> this
    returns an object with a next() method (or __next__() in Python 3).\n[This is
    the step most people forget to tell you about]\n\nUses the iterator to loop over
    items:\nKeep calling the next() method on the iterator returned from step 1. The
    return value from next() is assigned to x and the loop body is executed. If an
    exception StopIteration is raised from within next(), it means there are no more
    values in the iterator and the loop is exited.\n\nThe truth is Python performs
    the above two steps anytime it wants to loop over the contents of an object -
    so it could be a for loop, but it could also be code like otherlist.extend(mylist)
    (where otherlist is a Python list).\nHere mylist is an iterable because it implements
    the iterator protocol. In a user-defined class, you can implement the __iter__()
    method to make instances of your class iterable. This method should return an
    iterator. An iterator is an object with a next() method. It is possible to implement
    both __iter__() and next() on the same class, and have __iter__() return self.
    This will work for simple cases, but not when you want two iterators looping over
    the same object at the same time.\nSo that's the iterator protocol, many objects
    implement this protocol:\nBuilt-in lists, dictionaries, tuples, sets, and files.\nUser-defined
    classes that implement __iter__().\nGenerators.\nNote that a for loop doesn't
    know what kind of object it's dealing with - it just follows the iterator protocol,
    and is happy to get item after item as it calls next(). Built-in lists return
    their items one by one, dictionaries return the keys one by one, files return
    the lines one by one, etc. And generators return... well that's where yield comes
    in:\ndef f123():\n    yield 1\n    yield 2\n    yield 3\n\nfor item in f123():\n
    \   print item\n\nInstead of yield statements, if you had three return statements
    in f123() only the first would get executed, and the function would exit. But
    f123() is no ordinary function. When f123() is called, it does not return any
    of the values in the yield statements! It returns a generator object. Also, the
    function does not really exit - it goes into a suspended state. When the for loop
    tries to loop over the generator object, the function resumes from its suspended
    state at the very next line after the yield it previously returned from, executes
    the next line of code, in this case, a yield statement, and returns that as the
    next item. This happens until the function exits, at which point the generator
    raises StopIteration, and the loop exits.\nSo the generator object is sort of
    like an adapter - at one end it exhibits the iterator protocol, by exposing __iter__()
    and next() methods to keep the for loop happy. At the other end, however, it runs
    the function just enough to get the next value out of it and puts it back in suspended
    mode.\nWhy use generators?\nUsually, you can write code that doesn't use generators
    but implements the same logic. One option is to use the temporary list 'trick'
    I mentioned before. That will not work in all cases, for e.g. if you have infinite
    loops, or it may make inefficient use of memory when you have a really long list.
    The other approach is to implement a new iterable class SomethingIter that keeps
    the state in instance members and performs the next logical step in its next()
    (or __next__() in Python 3) method. Depending on the logic, the code inside the
    next() method may end up looking very complex and prone to bugs. Here generators
    provide a clean and easy solution.\n    "
