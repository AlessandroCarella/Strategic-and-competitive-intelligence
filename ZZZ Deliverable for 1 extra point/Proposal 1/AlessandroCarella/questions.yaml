  answer_text: "\nMany people use return rather than yield, but in some cases yield
    can be more efficient and easier to work with.\n\nHere is an example which yield
    is definitely best for:\n\n\n  return (in function)\n\n\nimport random\n\ndef
    return_dates():\n    dates = [] # With 'return' you need to create a list then
    return it\n    for i in range(5):\n        date = random.choice([\"1st\", \"2nd\",
    \"3rd\", \"4th\", \"5th\", \"6th\", \"7th\", \"8th\", \"9th\", \"10th\"])\n        dates.append(date)\n
    \   return dates\n\n\n\n  yield (in function)\n\n\ndef yield_dates():\n    for
    i in range(5):\n        date = random.choice([\"1st\", \"2nd\", \"3rd\", \"4th\",
    \"5th\", \"6th\", \"7th\", \"8th\", \"9th\", \"10th\"])\n        yield date #
    'yield' makes a generator automatically which works\n                   # in a
    similar way. This is much more efficient.\n\n\n\n  Calling functions\n\n\ndates_list
    = return_dates()\nprint(dates_list)\nfor i in dates_list:\n    print(i)\n\ndates_generator
    = yield_dates()\nprint(dates_generator)\nfor i in dates_generator:\n    print(i)\n\n\nBoth
    functions do the same thing, but yield uses three lines instead of five and has
    one less variable to worry about.\n\n\n  \n    This is the result from the code:\n
    \ \n\n\n\n\nAs you can see both functions do the same thing. The only difference
    is return_dates() gives a list and yield_dates() gives a generator.\n\nA real
    life example would be something like reading a file line by line or if you just
    want to make a generator.\n    "
  answer_code:
  - |
    import random

    def return_dates():
        dates = [] # With 'return' you need to create a list then return it
        for i in range(5):
            date = random.choice(["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"])
            dates.append(date)
        return dates
  - |
    def yield_dates():
        for i in range(5):
            date = random.choice(["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"])
            yield date # 'yield' makes a generator automatically which works
                       # in a similar way. This is much more efficient.
  - |
    dates_list = return_dates()
    print(dates_list)
    for i in dates_list:
        print(i)

    dates_generator = yield_dates()
    print(dates_generator)
    for i in dates_generator:
        print(i)
