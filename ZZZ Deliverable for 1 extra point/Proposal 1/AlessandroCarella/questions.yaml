  answer_text: "\nFrom a programming viewpoint, the iterators are implemented as thunks.\nTo
    implement concepts such as iterators, generators, concurrent execution via messages,
    etc., one uses messages sent to a closure object, which has a dispatcher, and
    the dispatcher answers to \"messages\" (this concept comes from Simula and is
    the central part of Smalltalk).\n\"next\" is a message sent to a closure, created
    by the \"iter\" call.\nThere are lots of ways to implement this computation. I
    used mutation, but it is possible to do this kind of computation without mutation,
    by returning the current value and the next yielder (making it referential transparent).
    \ Racket uses a sequence of transformations of the initial program in some intermediary
    languages, one of such rewriting making the yield operator to be transformed in
    some language with simpler operators.\nHere is a demonstration of how yield could
    be rewritten, which uses the structure of R6RS, but the semantics is identical
    to Python's. It's the same model of computation, and only a change in syntax is
    required to rewrite it using yield of Python.\n\nWelcome to Racket v6.5.0.3.\n\n->
    (define gen\n     (lambda (l)\n       (define yield\n         (lambda ()\n           (if
    (null? l)\n               'END\n               (let ((v (car l)))\n                 (set!
    l (cdr l))\n                 v))))\n       (lambda(m)\n         (case m\n           ('yield
    (yield))\n           ('init  (lambda (data)\n                     (set! l data)\n
    \                    'OK))))))\n-> (define stream (gen '(1 2 3)))\n-> (stream
    'yield)\n1\n-> (stream 'yield)\n2\n-> (stream 'yield)\n3\n-> (stream 'yield)\n'END\n->
    ((stream 'init) '(a b))\n'OK\n-> (stream 'yield)\n'a\n-> (stream 'yield)\n'b\n->
    (stream 'yield)\n'END\n-> (stream 'yield)\n'END\n->\n\n\n    "
