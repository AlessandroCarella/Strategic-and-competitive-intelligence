- answer_id: '33484904'
  answer_text: "\nAs already pointed out by many, itertools.chain() is the way to
    go if one needs to apply exactly the same treatment to both lists. In my case,
    I had a label and a flag which were different from one list to the other, so I
    needed something slightly more complex. As it turns out, behind the scenes itertools.chain()
    simply does the following:\n\nfor it in iterables:\n    for element in it:\n        yield
    element\n\n\n(see https://docs.python.org/2/library/itertools.html), so I took
    inspiration from here and wrote something along these lines:\n\nfor iterable,
    header, flag in ( (newList, 'New', ''), (modList, 'Modified', '-f')):\n    print
    header + ':'\n    for path in iterable:\n        [...]\n        command = 'cp
    -r' if os.path.isdir(srcPath) else 'cp'\n        print >> SCRIPT , command, flag,
    srcPath, mergedDirPath\n        [...]\n\n\nThe main points to understand here
    are that lists are just a special case of iterable, which are objects like any
    other; and that for ... in loops in python can work with tuple variables, so it
    is simple to loop on multiple variables at the same time. \n    "
  answer_code:
  - |
    for it in iterables:
        for element in it:
            yield element
  - |
    for iterable, header, flag in ( (newList, 'New', ''), (modList, 'Modified', '-f')):
        print header + ':'
        for path in iterable:
            [...]
            command = 'cp -r' if os.path.isdir(srcPath) else 'cp'
            print >> SCRIPT , command, flag, srcPath, mergedDirPath
            [...]
  answer_votes: 7
