  answer_text: "\nThere is one type of answer that I don't feel has been given yet,
    among the many great answers that describe how to use generators. Here is the
    programming language theory answer:\n\nThe yield statement in Python returns a
    generator. A generator in Python is a function that returns continuations (and
    specifically a type of coroutine, but continuations represent the more general
    mechanism to understand what is going on).\n\nContinuations in programming languages
    theory are a much more fundamental kind of computation, but they are not often
    used, because they are extremely hard to reason about and also very difficult
    to implement. But the idea of what a continuation is, is straightforward: it is
    the state of a computation that has not yet finished. In this state, the current
    values of variables, the operations that have yet to be performed, and so on,
    are saved. Then at some point later in the program the continuation can be invoked,
    such that the program's variables are reset to that state and the operations that
    were saved are carried out.\n\nContinuations, in this more general form, can be
    implemented in two ways. In the call/cc way, the program's stack is literally
    saved and then when the continuation is invoked, the stack is restored.\n\nIn
    continuation passing style (CPS), continuations are just normal functions (only
    in languages where functions are first class) which the programmer explicitly
    manages and passes around to subroutines. In this style, program state is represented
    by closures (and the variables that happen to be encoded in them) rather than
    variables that reside somewhere on the stack. Functions that manage control flow
    accept continuation as arguments (in some variations of CPS, functions may accept
    multiple continuations) and manipulate control flow by invoking them by simply
    calling them and returning afterwards. A very simple example of continuation passing
    style is as follows:\n\ndef save_file(filename):\n  def write_file_continuation():\n
    \   write_stuff_to_file(filename)\n\n  check_if_file_exists_and_user_wants_to_overwrite(write_file_continuation)\n\n\nIn
    this (very simplistic) example, the programmer saves the operation of actually
    writing the file into a continuation (which can potentially be a very complex
    operation with many details to write out), and then passes that continuation (i.e,
    as a first-class closure) to another operator which does some more processing,
    and then calls it if necessary. (I use this design pattern a lot in actual GUI
    programming, either because it saves me lines of code or, more importantly, to
    manage control flow after GUI events trigger.)\n\nThe rest of this post will,
    without loss of generality, conceptualize continuations as CPS, because it is
    a hell of a lot easier to understand and read.\n\n\n\nNow let's talk about generators
    in Python. Generators are a specific subtype of continuation. Whereas continuations
    are able in general to save the state of a computation (i.e., the program's call
    stack), generators are only able to save the state of iteration over an iterator.
    Although, this definition is slightly misleading for certain use cases of generators.
    For instance:\n\ndef f():\n  while True:\n    yield 4\n\n\nThis is clearly a reasonable
    iterable whose behavior is well defined -- each time the generator iterates over
    it, it returns 4 (and does so forever). But it isn't probably the prototypical
    type of iterable that comes to mind when thinking of iterators (i.e., for x in
    collection: do_something(x)). This example illustrates the power of generators:
    if anything is an iterator, a generator can save the state of its iteration.\n\nTo
    reiterate: Continuations can save the state of a program's stack and generators
    can save the state of iteration. This means that continuations are more a lot
    powerful than generators, but also that generators are a lot, lot easier. They
    are easier for the language designer to implement, and they are easier for the
    programmer to use (if you have some time to burn, try to read and understand this
    page about continuations and call/cc).\n\nBut you could easily implement (and
    conceptualize) generators as a simple, specific case of continuation passing style:\n\nWhenever
    yield is called, it tells the function to return a continuation.  When the function
    is called again, it starts from wherever it left off. So, in pseudo-pseudocode
    (i.e., not pseudocode, but not code) the generator's next method is basically
    as follows:\n\nclass Generator():\n  def __init__(self,iterable,generatorfun):\n
    \   self.next_continuation = lambda:generatorfun(iterable)\n\n  def next(self):\n
    \   value, next_continuation = self.next_continuation()\n    self.next_continuation
    = next_continuation\n    return value\n\n\nwhere the yield keyword is actually
    syntactic sugar for the real generator function, basically something like:\n\ndef
    generatorfun(iterable):\n  if len(iterable) == 0:\n    raise StopIteration\n  else:\n
    \   return (iterable[0], lambda:generatorfun(iterable[1:]))\n\n\nRemember that
    this is just pseudocode and the actual implementation of generators in Python
    is more complex. But as an exercise to understand what is going on, try to use
    continuation passing style to implement generator objects without use of the yield
    keyword.\n    "
  answer_code:
  - |
    def save_file(filename):
      def write_file_continuation():
        write_stuff_to_file(filename)

      check_if_file_exists_and_user_wants_to_overwrite(write_file_continuation)
  - |
    def f():
      while True:
        yield 4
  - |
    class Generator():
      def __init__(self,iterable,generatorfun):
        self.next_continuation = lambda:generatorfun(iterable)

      def next(self):
        value, next_continuation = self.next_continuation()
        self.next_continuation = next_continuation
        return value
  - |
    def generatorfun(iterable):
      if len(iterable) == 0:
        raise StopIteration
      else:
        return (iterable[0], lambda:generatorfun(iterable[1:]))
