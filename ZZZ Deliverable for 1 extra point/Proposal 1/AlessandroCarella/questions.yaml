  answer_text: "\nTL;DR\n\nInstead of this:\n\ndef square_list(n):\n    the_list =
    []                         # Replace\n    for x in range(n):\n        y = x *
    x\n        the_list.append(y)                # these\n    return the_list                       #
    lines\n\n\ndo this:\n\ndef square_yield(n):\n    for x in range(n):\n        y
    = x * x\n        yield y                           # with this one.\n\n\nWhenever
    you find yourself building a list from scratch, yield each piece instead. \n\nThis
    was my first \"aha\" moment with yield.\n\nyield is a sugary way to say \n\n\n
    \ build a series of stuff\n\n\nSame behavior:\n\n>>> for square in square_list(4):\n...
    \    print(square)\n...\n0\n1\n4\n9\n>>> for square in square_yield(4):\n...     print(square)\n...\n0\n1\n4\n9\n\n\nDifferent
    behavior:\n\nYield is single-pass: you can only iterate through once. When a function
    has a yield in it we call it a generator function. And an iterator is what it
    returns. Those terms are revealing. We lose the convenience of a container, but
    gain the power of a series that's computed as needed, and arbitrarily long.\n\nYield
    is lazy, it puts off computation. A function with a yield in it doesn't actually
    execute at all when you call it. It returns an iterator object that remembers
    where it left off. Each time you call next() on the iterator (this happens in
    a for-loop) execution inches forward to the next yield. return raises StopIteration
    and ends the series (this is the natural end of a for-loop).\n\nYield is versatile.
    Data doesn't have to be stored all together, it can be made available one at a
    time. It can be infinite.\n\n>>> def squares_all_of_them():\n...     x = 0\n...
    \    while True:\n...         yield x * x\n...         x += 1\n...\n>>> squares
    = squares_all_of_them()\n>>> for _ in range(4):\n...     print(next(squares))\n...\n0\n1\n4\n9\n\n\nIf
    you need multiple passes and the series isn't too long, just call list() on it:\n\n>>>
    list(square_yield(4))\n[0, 1, 4, 9]\n\n\nBrilliant choice of the word yield because
    both meanings apply:\n\n\n  yield — produce or provide (as in agriculture)\n\n\n...provide
    the next data in the series.\n\n\n  yield — give way or relinquish (as in political
    power)\n\n\n...relinquish CPU execution until the iterator advances.\n    "
