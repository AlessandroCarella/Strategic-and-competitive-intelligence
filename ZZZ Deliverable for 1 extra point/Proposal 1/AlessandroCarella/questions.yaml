- answer_id: '56407963'
  answer_text: "\n\nHow do I concatenate two lists in Python?\n\nAs of 3.9, these
    are the most popular stdlib methods for concatenating two (or more) lists in Python.\n\n\nVersion
    Restrictions\nIn-Place?\nGeneralize?*\na + b\n-\nNo\nsum(list_of_lists, [])1\nlist(chain(a,
    b))2\n>=2.3\nNo\nlist(chain(*list_of_lists))\n[*a, *b]3\n>=3.5\nNo\nNo\na += b\n-\nYes\nNo\na.extend(b)\n-\nYes\nNo\n\n*
    A solution will qualify as a generalized solution if it works for an unknown number
    of lists (say, inside a loop or list comprehension) \n\nFootnotes\nThis is a slick
    solution because of its succinctness. But sum performs concatenation in a pairwise
    fashion, which means this is a\nquadratic operation as memory has to be allocated
    for each step. DO\nNOT USE if your lists are large.\n\nSee chain\nand\nchain.from_iterable\nfrom
    the docs. You will need to from itertools import chain first.\nConcatenation is
    linear in memory, so this is the best in terms of\nperformance and version compatibility.
    chain.from_iterable was introduced in 2.6.\n\nThis method uses Additional Unpacking
    Generalizations (PEP 448), but cannot\ngeneralize to N lists unless you manually
    unpack each one yourself.\n\na += b and a.extend(b) are more or less equivalent
    for all practical purposes. += when called on a list will internally call\nlist.__iadd__,
    which extends the first list by the second.\n\n\nPerformance\n2-List Concatenation1\n\nThere's
    not much difference between these methods but that makes sense given they all
    have the same order of complexity (linear). There's no particular reason to prefer
    one over the other except as a matter of style.\nN-List Concatenation\n\nPlots
    have been generated using the perfplot module. Code, for your reference.\n1. The
    iadd (+=) and extend methods operate in-place, so a copy has to be generated each
    time before testing. To keep things fair, all methods have a pre-copy step for
    the left-hand list which can be ignored.\nComments on Other Solutions\nDO NOT
    USE THE DUNDER METHOD list.__add__ directly in any way, shape or form. In fact,
    stay clear of dunder methods, and use the operators and operator functions like
    they were designed for. Python has careful semantics baked into these which are
    more complicated than just calling the dunder directly. Here is an example. So,
    to summarise, a.__add__(b) => BAD; a + b => GOOD.\n\nSome answers here offer reduce(operator.add,
    [a, b]) for pairwise concatenation -- this is the same as sum([a, b], []) only
    more wordy.\n\nAny method that uses set will drop duplicates and lose ordering.
    Use with caution.\n\nfor i in b: a.append(i) is more wordy, and slower than a.extend(b),
    which is single function call and more idiomatic. append is slower because of
    the semantics with which memory is allocated and grown for lists. See here for
    a similar discussion.\n\nheapq.merge will work, but its use case is for merging
    sorted lists in linear time. Using it in any other situation is an anti-pattern.\n\nyielding
    list elements from a function is an acceptable method, but chain does this faster
    and better (it has a code path in C, so it is fast).\n\noperator.add(a, b) is
    an acceptable functional equivalent to a + b. It's use cases are mainly for dynamic
    method dispatch. Otherwise, prefer a + b which is shorter and more readable, in
    my opinion. YMMV.\n\n"
