  answer_text: "\nYield is an object\n\nA return in a function will return a single
    value.\n\nIf you want a function to return a huge set of values, use yield.\n\nMore
    importantly, yield is a barrier.\n\n\n  like barrier in the CUDA language, it
    will not transfer control until it gets\n  completed.\n\n\nThat is, it will run
    the code in your function from the beginning until it hits yield. Then, it’ll
    return the first value of the loop.\n\nThen, every other call will run the loop
    you have written in the function one more time, returning the next value until
    there isn't any value to return.\n    "
